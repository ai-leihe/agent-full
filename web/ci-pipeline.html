<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>腾讯云 Coding · 流水线运行详情</title>
<link rel="stylesheet" href="/assets/app.css" />
<style>
  .pipe-wrap { padding: var(--view-pad); max-width: 1180px; }
  .pipe-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .pipe-head-l { display: flex; align-items: center; gap: 12px; }
  .pipe-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--accent-line); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--accent); }
  .pipe-title { font-size: 16px; font-weight: 500; }
  .pipe-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
  .pipe-actions { display: flex; align-items: center; gap: 8px; }
  .btn { font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; }
  .btn:hover { background: var(--hover-bg); border-color: var(--accent-line); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
  .tag.run { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
  .tag.fail { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
  .tag.idle { background: var(--panel-2); color: var(--muted); border-color: var(--border); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px 16px; }
  .card .k { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .v { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .card .v.ok { color: var(--ok); }

  .panel { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .panel-h .t { font-size: 13px; font-weight: 500; }
  .panel-h .x { font-size: 12px; color: var(--muted); }

  .stages { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
  .stage { flex: 1 0 104px; min-width: 104px; text-align: center; position: relative; }
  .stage:not(:last-child)::after { content: ""; position: absolute; top: 13px; left: calc(50% + 18px); right: calc(-50% + 18px); height: 2px; background: var(--border); }
  .stage.done:not(:last-child)::after { background: var(--ok-border); }
  .stage.run:not(:last-child)::after { background: linear-gradient(90deg, var(--ok-border), var(--border)); }
  .dot { width: 26px; height: 26px; margin: 0 auto 8px; border-radius: 50%; border: 2px solid var(--border); background: var(--inset); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); position: relative; z-index: 1; }
  .stage.done .dot { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .stage.run .dot { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  .stage .n { font-size: 12px; font-weight: 500; }
  .stage .d { font-size: 11px; color: var(--muted-2); margin-top: 3px; }
  .stage.idle { opacity: .45; }
  .stage .bar { height: 3px; border-radius: 2px; background: var(--panel-3); margin: 7px 12px 0; overflow: hidden; }
  .stage .bar i { display: block; height: 100%; background: var(--warn); width: 0; }

  .log { background: var(--inset); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.9; overflow-x: auto; }
  .log .l { white-space: pre; }
  .log .cmd { color: var(--muted); }
  .log .ok { color: var(--ok); }
  .log .info { color: var(--muted); }
  .log .warn { color: var(--warn); }
  .log .err { color: var(--danger); }
  .log .caret { display: inline-block; width: 7px; height: 13px; background: var(--accent); vertical-align: -2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }

  .meter { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--muted); }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <div class="title">Agent 平台</div>
        <div class="ver">CI 流水线</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group">交付</div>
      <a class="nav-item" href="#/pipeline"><span class="ic">▶</span>流水线</a>
      <a class="nav-item" href="#/builds"><span class="ic">≡</span>构建历史</a>
      <div class="nav-group">质量</div>
      <a class="nav-item" href="#/scan"><span class="ic">◈</span>代码扫描</a>
      <a class="nav-item" href="#/tests"><span class="ic">✓</span>测试报告</a>
      <div class="nav-group">部署</div>
      <a class="nav-item" href="#/artifacts"><span class="ic">◫</span>制品仓库</a>
      <a class="nav-item" href="#/gray"><span class="ic">◐</span>灰度发布</a>
    </nav>
  </aside>

  <main class="main">
    <div class="pipe-wrap" id="app"></div>
  </main>
</div>

<script>
const STAGES = [
  { n: '代码检出', s: 'done', d: '8s' },
  { n: '代码扫描', s: 'done', d: '24s' },
  { n: '单元测试', s: 'done', d: '41s' },
  { n: '镜像构建', s: 'run',  d: '62s 进行中' },
  { n: '部署测试', s: 'idle', d: '等待' },
  { n: '冒烟测试', s: 'idle', d: '等待' },
  { n: '灰度发布', s: 'idle', d: '等待' }
];

const LOGS = [
  { c: 'cmd',  t: '$ docker build -t ccr.ccs.tencentyun.com/prod/df-agent:1.0.2 .' },
  { c: 'ok',   t: 'Step 1/8 : FROM python:3.11-slim-bookworm' },
  { c: 'ok',   t: 'Step 2/8 : RUN sed -i s/deb.debian.org/mirrors.tencent.com/ /etc/apt/sources.list' },
  { c: 'ok',   t: 'Step 3/8 : RUN apt-get install -y libfreetype6' },
  { c: 'ok',   t: 'Step 4/8 : COPY requirements.txt .' },
  { c: 'ok',   t: 'Step 5/8 : RUN pip install -r requirements.txt -i mirrors.tencent.com' },
  { c: 'info', t: '           -> Successfully installed fastapi-0.110.0 pyhive-0.7.0 flask-3.0.2' },
  { c: 'ok',   t: 'Step 6/8 : COPY app/ /app/' },
  { c: 'info', t: '           -> 复制 23 个 Python 模块' },
  { c: 'warn', t: 'Step 7/8 : RUN python -m unittest discover -s tests' }
];

function stageHTML(s, i) {
  const mark = s.s === 'done' ? '✓' : (s.s === 'run' ? '●' : String(i + 1));
  const bar = s.s === 'run' ? '<div class="bar"><i style="width:46%"></i></div>' : '';
  return `<div class="stage ${s.s}">
    <div class="dot">${mark}</div>
    <div class="n">${s.n}</div>
    <div class="d">${s.d}</div>
    ${bar}
  </div>`;
}

document.getElementById('app').innerHTML = `
  <div class="pipe-head">
    <div class="pipe-head-l">
      <div class="pipe-logo">C</div>
      <div>
        <div class="pipe-title">df-agent · 构建与部署流水线</div>
        <div class="pipe-sub">#2187 · feature/df-agent-merge → main</div>
      </div>
    </div>
    <div class="pipe-actions">
      <span class="tag run">运行中</span>
      <button class="btn">查看变更</button>
      <button class="btn primary">重新运行</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div class="k">总耗时</div><div class="v">2分38秒</div></div>
    <div class="card"><div class="k">变更文件</div><div class="v">17</div></div>
    <div class="card"><div class="k">质量门禁</div><div class="v ok">通过</div></div>
    <div class="card"><div class="k">镜像版本</div><div class="v">1.0.2</div></div>
  </div>

  <div class="panel">
    <div class="panel-h"><div class="t">执行链路</div><div class="x">7 个阶段 · 已完成 3</div></div>
    <div class="stages">${STAGES.map(stageHTML).join('')}</div>
  </div>

  <div class="panel">
    <div class="panel-h"><div class="t">镜像构建 · 日志输出</div><div class="x">自动滚动</div></div>
    <div class="log" id="log"></div>
    <div class="meter"><span class="pulse-dot"></span>构建进行中，预计剩余 1 分 12 秒</div>
  </div>
`;

const logEl = document.getElementById('log');
let li = 0;
(function tick() {
  if (li < LOGS.length) {
    const item = LOGS[li++];
    const div = document.createElement('div');
    div.className = 'l';
    div.innerHTML = `<span class="${item.c}">${item.t.replace(/</g, '&lt;')}</span>`;
    logEl.appendChild(div);
    setTimeout(tick, 260);
  } else {
    const c = document.createElement('div');
    c.className = 'l';
    c.innerHTML = '<span class="caret"></span>';
    logEl.appendChild(c);
  }
})();
</script>
</body>
</html>
