<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent 平台 · 工作台</title>
<link rel="stylesheet" href="/assets/app.css?v=2" />
<script>
// 尽早应用本地主题，避免首屏闪烁（app.js 加载后会用账号偏好覆盖）
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('agent-platform.theme') || '{}') || {};
    var root = document.documentElement;
    root.dataset.mode = t.mode === 'light' ? 'light'
      : t.mode === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : 'dark';
    ['accent', 'radius', 'density', 'glass'].forEach(function (k) {
      if (t[k]) root.dataset[k] = t[k];
    });
  } catch (e) { /* 忽略损坏的本地偏好 */ }
})();
</script>
</head>
<body>

<div class="layout">

  <!-- ==================== 左侧导航 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <div class="title" id="brandName">Agent 平台</div>
        <div class="ver" id="brandVer"></div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-group">运行</div>
      <a class="nav-item" href="#/overview" data-hash="#/overview"><span class="ic">◎</span>概览</a>

      <div class="nav-group">编排</div>
      <a class="nav-item" href="#/orchestration" data-hash="#/orchestration"><span class="ic">⌗</span>编排工作台</a>
      <a class="nav-item" href="#/skills" data-hash="#/skills"><span class="ic">◈</span>技能库</a>

      <div class="nav-group">数据</div>
      <a class="nav-item" href="#/runs" data-hash="#/runs"><span class="ic">≡</span>运行记录</a>
      <a class="nav-item" href="#/knowledge" data-hash="#/knowledge"><span class="ic">◫</span>知识库</a>

      <div class="nav-group">账户</div>
      <a class="nav-item" href="#/profile" data-hash="#/profile"><span class="ic">☺</span>个人中心</a>
      <a class="nav-item" href="#/theme" data-hash="#/theme"><span class="ic">◐</span>主题外观</a>
      <a class="nav-item hidden" href="#/users" data-hash="#/users" data-admin-only><span class="ic">☷</span>用户管理</a>

      <div class="nav-group">管理</div>
      <a class="nav-item" href="#/settings" data-hash="#/settings"><span class="ic">⚙</span>系统设置</a>
      <a class="nav-item" href="/docs" target="_blank" rel="noopener" data-nav="docs" data-act="open-docs"
         title="在独立页面查看接口文档（需登录，页面会绑定当前账号会话）"><span class="ic">↗</span>API 文档</a>
    </nav>

    <div class="sidebar-foot">
      <button class="user-card" type="button" id="userCard" data-act="user-menu">
        <span class="avatar sm" id="userAvatar">?</span>
        <span class="meta">
          <span class="name" id="userName">未登录</span>
          <span class="role" id="userRole">加载中…</span>
        </span>
        <span class="caret">▲</span>
      </button>
    </div>

    <div class="user-menu hidden" id="userMenu"></div>
  </aside>

  <!-- ==================== 主区域 ==================== -->
  <div class="main">
    <header class="topbar">
      <button class="btn xs menu-toggle" data-act="toggle-sidebar">☰</button>
      <div>
        <h1 id="viewTitle">概览</h1>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="row" id="topChips" style="gap:6px"></div>
      <button class="btn xs" data-act="reload-plugins">重扫插件</button>
      <button class="btn xs primary" id="btnApply" data-act="apply-draft">应用生效</button>
    </header>

    <main class="view" id="view">
      <div class="loading"><span class="spin"></span> 初始化…</div>
    </main>
  </div>

</div>

<div class="gate hidden" id="gate"></div>
<div class="modal-mask hidden" id="modal"></div>
<div class="toasts" id="toasts"></div>

<script src="/assets/app.js?v=2"></script>
</body>
</html>
