# 应用容器编排（向量库另见 deploy/milvus/docker-compose.yml）
#
#   1) 先起向量库：cd deploy/milvus && docker compose up -d
#   2) 再起本服务：docker compose -f deploy/docker-compose.yml up -d --build
#   3) 看健康：    curl http://127.0.0.1:8000/api/health
#
# 地址语义提醒：容器里的 localhost 是容器自己，**不能**用宿主机的 localhost 指宿主服务。
# 所以这里用 APP_MILVUS_URI 作为「容器视角地址」的覆盖点（默认走 host.docker.internal），
# 想沿用项目根 .env 时请用：docker compose -f deploy/docker-compose.yml --env-file .env up -d
# （根 .env 里的 MILVUS_URI=http://localhost:19530 是宿主机视角，不会被注入容器。）
#
# 若希望应用与 Milvus 走同一个容器网络、用容器名互访，把下面注释的两行打开，
# 并把 MILVUS_URI 改成 http://milvus-standalone:19530：
#   networks: [default, milvus]
# networks:
#   milvus:
#     name: milvus          # 由 deploy/milvus/docker-compose.yml 创建
#     external: true
name: agent-platform

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # 可选依赖：默认「Milvus 入库 + PDF/Word 解析」，需要更多就改这里或 Dockerfile
      # args:
      #   EXTRAS: "pymilvus>=3.0.0 pypdf>=4.0.0 python-docx>=1.1.0 openai>=1.30.0"
    image: agent-platform:latest
    container_name: agent-platform-app
    restart: unless-stopped
    ports:
      # 宿主机端口可用 APP_PORT 覆盖（默认 8000）
      - "${APP_PORT:-8000}:8000"
    extra_hosts:
      # Linux 上补出 host.docker.internal（Windows / macOS 原生自带）
      - "host.docker.internal:host-gateway"
    environment:
      # 平台数据库：留空 = 容器内 SQLite（数据卷里的 data/platform.db）
      # 生产建议换外部库，例如 mysql://app:app123456@mysql:3306/agent_platform?charset=utf8mb4
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:-}
      # 向量库（容器视角地址，见文件头说明）
      MILVUS_URI: ${APP_MILVUS_URI:-http://host.docker.internal:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-default}
      MILVUS_METRIC_TYPE: ${MILVUS_METRIC_TYPE:-COSINE}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 平台状态全在这里：platform.db + uploads/ + script_workspace/
      - app-data:/app/data
      # 外部插件热插拔：往宿主机 ext_plugins/ 丢 .py 后重启容器即生效
      - ../ext_plugins:/app/ext_plugins:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # 具名卷：docker volume inspect agent-platform-data 可看落盘位置
  app-data:
    name: agent-platform-data
